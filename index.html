<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experimental and Computational Multiphase Flow 2026</title>
<style>
:root {
  --bg: #fef9f3;
  --card: #ffffff;
  --primary: #d35400;
  --primary-dark: #a04000;
  --accent: #e67e22;
  --accent-light: #fdebd0;
  --accent-bg: #fff5e6;
  --text: #3e2723;
  --text-muted: #795548;
  --border: #f0d9c8;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(139,69,19,0.06), 0 4px 12px rgba(139,69,19,0.04);
  --shadow-hover: 0 4px 12px rgba(139,69,19,0.1), 0 8px 24px rgba(139,69,19,0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
  background: linear-gradient(135deg, #2980b9 0%, #3498db 50%, #5dade2 100%);
  color: #fff;
  padding: 28px 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(41,128,185,0.25);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.3px; }
.header p { font-size: 0.85rem; opacity: 0.8; font-weight: 400; }

/* Search */
.search-section {
  max-width: 1200px;
  margin: 24px auto 12px;
  padding: 0 24px;
}
.search-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: stretch;
}
.search-wrap {
  flex: 1;
  min-width: 220px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.95rem;
  background: var(--card);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(230,126,34,0.12);
}
.search-wrap .icon {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 1.1rem;
  pointer-events: none;
}

.filter-select {
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.88rem;
  background: var(--card);
  cursor: pointer;
  min-width: 130px;
  transition: border-color 0.2s;
}
.filter-select:focus {
  outline: none;
  border-color: var(--accent);
}

/* Stats */
.stats-row {
  max-width: 1200px;
  margin: 0 auto 20px;
  padding: 0 24px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.stat-chip {
  background: var(--card);
  padding: 8px 16px;
  border-radius: 24px;
  font-size: 0.82rem;
  color: var(--text-muted);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 1px 2px rgba(139,69,19,0.04);
}
.stat-chip strong { color: #2980b9; font-size: 1rem; }
.stat-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #2980b9; }

/* Article List */
.list {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 48px;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border-left: 4px solid transparent;
  transition: all 0.2s ease;
}
.card:hover {
  border-left-color: #2980b9;
  box-shadow: var(--shadow-hover);
  transform: translateY(-1px);
}
.card.open { border-left-color: #2980b9; }

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  cursor: pointer;
}
.card-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  flex: 1;
  line-height: 1.45;
}
.card-title:hover { color: #2980b9; }

.badges { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
.badge-year {
  background: #2980b9;
  color: #fff;
  padding: 3px 10px;
  border-radius: 14px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-type {
  background: var(--accent-bg);
  color: var(--primary);
  padding: 3px 10px;
  border-radius: 14px;
  font-size: 0.75rem;
  font-weight: 500;
}
.btn-expand {
  background: var(--accent-bg);
  color: #2980b9;
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 14px;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-expand:hover {
  background: #2980b9;
  color: #fff;
}

.card-authors {
  font-size: 0.84rem;
  color: #8d6e63;
  margin-top: 8px;
  line-height: 1.5;
  max-width: 700px;
}
.card-keywords {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.kw {
  background: var(--accent-bg);
  color: var(--primary);
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 0.74rem;
}

/* Detail Panel */
.detail {
  display: none;
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.card.open .detail { display: block; }

.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.d-item { font-size: 0.83rem; }
.d-item label {
  display: block;
  color: #a1887f;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 2px;
}
.d-item span { color: var(--text); font-weight: 500; }

.d-abstract {
  font-size: 0.88rem;
  color: var(--text);
  line-height: 1.75;
  margin-top: 10px;
  padding: 12px 16px;
  background: var(--accent-bg);
  border-radius: 8px;
  border-left: 3px solid #2980b9;
}

.d-links {
  margin-top: 14px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.d-links a {
  font-size: 0.83rem;
  color: #2980b9;
  text-decoration: none;
  font-weight: 500;
}
.d-links a:hover { text-decoration: underline; }

/* Cite */
.d-cite {
  margin-top: 10px;
  padding: 10px 14px;
  background: #f8f9fa;
  border-radius: 8px;
  border-left: 3px solid #2980b9;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.d-cite-text {
  flex: 1;
  font-size: 0.82rem;
  color: var(--text-muted);
  line-height: 1.6;
  word-break: break-word;
}
.d-cite-copy {
  background: #2980b9;
  color: #fff;
  border: none;
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s;
}
.d-cite-copy:hover { background: #1a5276; }
.d-cite-copy.copied { background: #27ae60; }

.card-doi {
  font-family: 'Source Han Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.8rem;
  margin-top: 6px;
  word-break: break-all;
}
.card-doi a {
  color: #2980b9;
  text-decoration: none;
}
.card-doi a:hover {
  text-decoration: underline;
}

/* Loading / Empty */
.center-msg {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.spinner {
  display: inline-block;
  width: 28px; height: 28px;
  border: 3px solid var(--border);
  border-top-color: #2980b9;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.footer {
  text-align: center;
  padding: 24px;
  color: var(--text-muted);
  font-size: 0.8rem;
  border-top: 1px solid var(--border);
  margin-top: 24px;
}
.footer a { color: #2980b9; text-decoration: none; }

/* Mobile */
@media (max-width: 768px) {
  .header { padding: 16px 0 12px; }
  .header-inner { padding: 0 16px; flex-direction: column; align-items: flex-start; }
  .header h1 { font-size: 1.2rem; }
  .header p { font-size: 0.75rem; }
  .search-section { margin: 16px auto 8px; padding: 0 16px; }
  .search-wrap input { padding: 10px 14px 10px 38px; font-size: 0.9rem; }
  .filter-select { padding: 10px 12px; font-size: 0.85rem; min-width: 100px; }
  .card { padding: 16px; margin-bottom: 10px; }
  .card-head { flex-direction: column; gap: 8px; }
  .card-title { font-size: 0.95rem; }
  .card-authors { max-width: 100%; font-size: 0.8rem; }
  .detail-grid { grid-template-columns: 1fr; gap: 8px; }
  .d-links { flex-direction: column; gap: 8px; }
  .d-cite { flex-direction: column; gap: 8px; padding: 10px 12px; }
  .d-cite-copy { padding: 8px 12px; font-size: 0.85rem; width: 100%; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div>
      <h1>Experimental and Computational Multiphase Flow</h1>
      <p>Volume 8 (2026) — Article Index & Search</p>
    </div>
  </div>
</header>

<section class="search-section">
  <div class="search-row">
    <div class="search-wrap">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search by title, author, keyword...">
    </div>
    <select class="filter-select" id="issueFilter"><option value="">All Issues</option></select>
    <select class="filter-select" id="typeFilter"><option value="">All Types</option></select>
  </div>
</section>

<div class="stats-row" id="statsRow"></div>

<div class="list" id="articleList">
  <div class="center-msg"><div class="spinner"></div><div>Loading articles...</div></div>
</div>

<div class="footer">
  Experimental and Computational Multiphase Flow &copy; 2026 — Data from <a href="https://www.sciopen.com" target="_blank">SciOpen</a>
</div>

<script>
const DATA_URL = 'ecmf_articles.json';
let allArticles = [];
let filteredArticles = [];

const $search = document.getElementById('searchInput');
const $issue = document.getElementById('issueFilter');
const $type = document.getElementById('typeFilter');
const $list = document.getElementById('articleList');
const $stats = document.getElementById('statsRow');

/* ── Load ── */
async function loadData() {
  try {
    const r = await fetch(DATA_URL);
    allArticles = await r.json();
    filteredArticles = allArticles;
    fillFilters();
    render();
  } catch (e) {
    $list.innerHTML = `<div class="center-msg">⚠️ Failed to load: ${e.message}</div>`;
  }
}

/* ── Filters ── */
function fillFilters() {
  const issues = new Set(), types = new Set();
  allArticles.forEach(a => { 
    if (a.issue) issues.add(a.issue); 
    if (a.type) types.add(a.type); 
  });
  [...issues].sort((a,b)=>a-b).forEach(i => {
    const o = document.createElement('option'); o.value = i; o.textContent = 'Issue ' + i; $issue.appendChild(o);
  });
  [...types].sort().forEach(t => {
    const o = document.createElement('option'); o.value = t; o.textContent = t; $type.appendChild(o);
  });
}

let currentQuery = '';

function applyFilters() {
  const q = $search.value.trim();
  currentQuery = q;
  const iv = $issue.value, tv = $type.value;
  filteredArticles = allArticles
    .map(a => {
      if (iv && a.issue != iv) return null;
      if (tv && a.type !== tv) return null;
      const score = searchScore(a, q);
      if (q && score === 0) return null;
      return { ...a, _score: score, _q: q };
    })
    .filter(Boolean)
    .sort((a, b) => b._score - a._score);
  render();
}

/* ── Highlight ── */
function highlight(text, query) {
  if (!query || !text) return esc(text || '');
  const tokens = query.trim().split(/\s+/).filter(Boolean);
  let result = esc(text);
  for (const tok of tokens) {
    const re = new RegExp('(' + tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    result = result.replace(re, '<mark style="background:#fde047;padding:0 2px;border-radius:2px">$1</mark>');
  }
  return result;
}

/* ── Fuzzy Search ── */
function fuzzyMatch(text, query) {
  if (!query) return { match: true, score: 0 };
  const t = (text || '').toLowerCase();
  const q = query.toLowerCase().trim();
  if (!q) return { match: true, score: 0 };
  if (t.includes(q)) return { match: true, score: 10 };
  const tokens = q.split(/\s+/);
  let allMatch = true;
  for (const tok of tokens) {
    if (!t.includes(tok)) { allMatch = false; break; }
  }
  if (allMatch) return { match: true, score: 5 };
  let qi = 0;
  for (let i = 0; i < t.length && qi < q.length; i++) {
    if (t[i] === q[qi]) qi++;
  }
  if (qi === q.length) return { match: true, score: 2 };
  return { match: false, score: 0 };
}

function searchScore(a, q) {
  if (!q) return 1;
  const tokens = q.toLowerCase().trim().split(/\s+/);
  let total = 0;
  let anyMatch = false;
  for (const tok of tokens) {
    const fields = [
      { v: a.title || '', w: 10 },
      { v: (a.authors||[]).map(x=>x.name).join(' ') || '', w: 5 },
      { v: (a.keywords||[]).join(' ') || '', w: 4 },
      { v: a.abstract || '', w: 1 },
    ];
    let best = 0;
    for (const f of fields) {
      const r = fuzzyMatch(f.v, tok);
      if (r.match) {
        anyMatch = true;
        best = Math.max(best, r.score * f.w);
      }
    }
    total += best;
  }
  return anyMatch ? total : 0;
}

/* ── Render ── */
function render() {
  $stats.innerHTML = `
    <div class="stat-chip"><span class="dot"></span><strong>${filteredArticles.length}</strong> articles</div>
  `;

  if (!filteredArticles.length) {
    $list.innerHTML = `<div class="center-msg"><div style="font-size:2.5rem;margin-bottom:8px">🔍</div><div>No articles found</div></div>`;
    return;
  }

  $list.innerHTML = filteredArticles.map((a,i) => {
    const formattedAuthors = (a.authors||[]).map(au => {
      const name = (au.name || '').trim();
      return `<span style="display:inline-block;white-space:nowrap">${esc(name)}</span>`;
    });
    const shortNames = formattedAuthors.join(', ');
    const kws = (a.keywords||[]).slice(0,5).map(k => `<span class="kw">${highlight(k.replace(/<[^>]+>/g, ''), currentQuery)}</span>`).join('');
    const volIssue = (a.volume || a.issue) ? `Vol.${a.volume||'?'} Issue ${a.issue||'?'}` : '';

    return `
    <div class="card" data-idx="${i}">
      <div class="card-head" onclick="toggle(this.parentElement)">
        <div class="card-title">${highlight(a.title.replace(/<[^>]+>/g, ''), currentQuery)}</div>
        <div class="badges">
          <span class="badge-year">2026</span>
          ${a.type ? `<span class="badge-type">${esc(a.type)}</span>` : ''}
          ${volIssue ? `<span class="badge-type">${esc(volIssue)}</span>` : ''}
          ${a.doi ? `<a class="btn-expand" style="color:#2980b9;text-decoration:none;font-weight:500" href="https://doi.org/${a.doi}" target="_blank" onclick="event.stopPropagation()">DOI</a>` : ''}
          ${a.doi ? `<button class="btn-expand" style="color:#27ae60" onclick="event.stopPropagation();downloadRIS(${i})">Download RIS</button>` : ''}
          <button class="btn-expand" onclick="event.stopPropagation();toggle(this.closest('.card'))">展开 ▾</button>
        </div>
      </div>
      <div class="card-authors">${shortNames}</div>
      ${kws ? `<div class="card-keywords">${kws}</div>` : ''}
      ${a.doi ? `<div class="card-doi"><a href="https://doi.org/${a.doi}" target="_blank" onclick="event.stopPropagation()">https://doi.org/${esc(a.doi)}</a></div>` : ''}
      <div class="detail">
        <div class="detail-grid">
          ${a.doi ? `<div class="d-item"><label>DOI</label><span>${esc(a.doi)}</span></div>` : ''}
          ${a.volume ? `<div class="d-item"><label>Volume(Issue)</label><span>${a.volume}(${a.issue})</span></div>` : ''}
          ${a.firstpage ? `<div class="d-item"><label>Pages</label><span>${a.firstpage}-${a.lastpage}</span></div>` : ''}
          ${a.publication_date ? `<div class="d-item"><label>Published</label><span>${esc(a.publication_date)}</span></div>` : ''}
        </div>
        ${a.abstract ? `<div class="d-abstract"><strong>Abstract:</strong> ${highlight(a.abstract.replace(/<[^>]+>/g, ''), currentQuery)}</div>` : ''}
        ${a.doi ? `
        <div class="d-cite">
          <div class="d-cite-text" id="cite-${i}"><strong>Cite this article:</strong> <span class="cite-content"></span></div>
          <button class="d-cite-copy" onclick="event.stopPropagation();copyCite(${i})">复制</button>
        </div>` : ''}
        <div class="d-links">
          ${a.url ? `<a href="${a.url}" target="_blank" onclick="event.stopPropagation()">View on SciOpen →</a>` : ''}
          ${a.pdf ? `<a href="${a.pdf}" target="_blank" onclick="event.stopPropagation()">Download PDF →</a>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── Toggle ── */
function toggle(card) {
  card.classList.toggle('open');
  const btn = card.querySelector('.btn-expand');
  if (btn) {
    btn.textContent = card.classList.contains('open') ? '收起 ▴' : '展开 ▾';
  }
  if (card.classList.contains('open')) {
    const idx = parseInt(card.dataset.idx);
    const a = filteredArticles[idx];
    const citeEl = card.querySelector('.cite-content');
    if (citeEl && a) citeEl.textContent = getCiteText(a);
  }
}

/* ── Cite Text ── */
function getCiteText(a) {
  const aus = (a.authors||[]).map(au => {
    const name = (au.name || '').trim();
    const parts = name.split(/\s+/);
    if (parts.length >= 2) {
      const last = parts[parts.length-1];
      const firstInit = parts[0]?.[0]?.toUpperCase() || '';
      return `${last} ${firstInit}`;
    }
    return name;
  });
  let authorStr;
  if (aus.length > 3) {
    authorStr = aus.slice(0,3).join(', ') + ', et al';
  } else {
    authorStr = aus.join(', ');
  }
  const year = a.year || '';
  const title = (a.title || '').replace(/<[^>]+>/g, '');
  const volIssue = (a.volume || a.issue) ? `${a.volume||''}(${a.issue||''})` : '';
  const pages = (a.firstpage && a.lastpage) ? `${a.firstpage}-${a.lastpage}` : '';
  const doiUrl = `https://doi.org/${a.doi || ''}`;
  return `${authorStr}. ${title}. Experimental and Computational Multiphase Flow, ${year}, ${volIssue}: ${pages}. ${doiUrl}`;
}

/* ── Copy Cite ── */
function copyCite(idx) {
  const a = filteredArticles[idx];
  if (!a) return;
  const text = getCiteText(a);
  const btn = event.target;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showCopied(btn);
    }).catch(() => {
      fallbackCopy(text, btn);
    });
  } else {
    fallbackCopy(text, btn);
  }
}

function fallbackCopy(text, btn) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showCopied(btn);
  } catch(e) {}
  document.body.removeChild(ta);
}

function showCopied(btn) {
  btn.textContent = '已复制 ✓';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = '复制';
    btn.classList.remove('copied');
  }, 1500);
}

/* ── Download RIS ── */
function downloadRIS(idx) {
  const a = filteredArticles[idx];
  if (!a) return;
  const ris = [];
  ris.push('TY  - JOUR');
  (a.authors||[]).forEach(au => {
    const name = au.name || '';
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) {
      ris.push('AU  - ' + parts[parts.length-1] + ', ' + parts.slice(0,-1).join(' '));
    } else {
      ris.push('AU  - ' + name);
    }
  });
  if (a.year) ris.push('PY  - ' + a.year);
  ris.push('TI  - ' + (a.title||'').replace(/<[^>]+>/g, ''));
  ris.push('JO  - Experimental and Computational Multiphase Flow');
  ris.push('SN  - 2661-8869');
  if (a.firstpage) ris.push('SP  - ' + a.firstpage);
  if (a.lastpage) ris.push('EP  - ' + a.lastpage);
  if (a.volume) ris.push('VL  - ' + a.volume);
  if (a.issue) ris.push('IS  - ' + a.issue);
  if (a.abstract) ris.push('AB  - ' + a.abstract.replace(/<[^>]+>/g, '').replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16))).replace(/\\\//g,'/').replace(/\\\\/g,'\\').replace(/\s+/g,' ').trim());
  if (a.doi) ris.push('UR  - https://doi.org/' + a.doi);
  if (a.doi) ris.push('DO  - ' + a.doi);
  const fn = (a.doi||'ECMF').replace(/[/\\]/g,'_') + '.ris';
  download(ris.join('\r\n') + '\r\n', fn, 'application/x-research-info-systems;charset=utf-8;');
}

/* ── Download helper ── */
function download(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ── Escape ── */
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Events ── */
$search.addEventListener('input', debounce(applyFilters, 300));
$issue.addEventListener('change', applyFilters);
$type.addEventListener('change', applyFilters);

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/* ── Init ── */
loadData();
</script>
